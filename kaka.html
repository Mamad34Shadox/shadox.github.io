
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کاکا سندی | ادیت مخصوص</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090909;
    color: white;
    font-family: Vazirmatn, sans-serif;
    overflow: hidden;
}

.page {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    transition: opacity .5s;
}

.hidden {
    display: none !important;
}

/* صفحه اول */

#home {
    background:
    radial-gradient(circle at center, #351010, #090909 70%);
}

.main-title {
    font-size: clamp(55px, 12vw, 110px);
    font-weight: 900;
    color: #ff2020;
    text-shadow: 0 0 20px red, 0 0 60px #ff0000;
    animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
}

.subtitle {
    font-size: 22px;
    margin: 15px;
}

.edit-button {
    margin-top: 30px;
    padding: 18px 55px;
    font-family: inherit;
    font-size: 23px;
    font-weight: 900;
    color: white;
    background: linear-gradient(135deg, #ff0000, #750000);
    border: 2px solid #ff5555;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 0 25px red;
    transition: .3s;
}

.edit-button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 50px red;
}

/* صفحه ماتریکس */

#matrixPage {
    background: rgba(0,0,0,.9);
}

#matrix {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.matrix-content {
    position: relative;
    z-index: 2;
    text-shadow: 0 0 20px #00ff00;
}

.hacked {
    color: #00ff00;
    font-size: clamp(45px, 10vw, 90px);
    font-weight: 900;
    animation: glitch .15s infinite alternate;
}

@keyframes glitch {
    from { transform: translateX(-2px); }
    to { transform: translateX(2px); }
}

.evil {
    font-size: 100px;
    margin-top: 20px;
    animation: evil 0.5s infinite alternate;
}

@keyframes evil {
    to { transform: rotate(10deg) scale(1.2); }
}

/* صفحه شوخی */

#jokePage {
    background: radial-gradient(circle, #351010, #050505);
}

.joke-title {
    font-size: clamp(40px, 9vw, 80px);
    color: #ff3030;
    font-weight: 900;
}

.laugh {
    font-size: 100px;
    margin: 20px;
}
</style>
</head>

<body>

<!-- صفحه اول -->

<section class="page" id="home">

    <div class="main-title">کاکا سندی</div>

    <div class="subtitle">
        بیا این ادیتت احمق 😂
    </div>

    <button class="edit-button" onclick="startPrank()">
        ادیت کاکا سندی
    </button>

</section>

<!-- صفحه ماتریکس -->

<section class="page hidden" id="matrixPage">

    <canvas id="matrix"></canvas>

    <div class="matrix-content">
        <div class="hacked">هک شدی!</div>
        <div class="evil">😈😂</div>
        <h2>سیستم در حال بررسی است...</h2>
    </div>

</section>

<!-- صفحه شوخی -->

<section class="page hidden" id="jokePage">

    <div class="joke-title">شوخی کردم!</div>

    <p class="download-text">
    ادیتت الان دانلود میشه...
</p>

    <div class="laugh">😂🤣</div>

    <h2>فکر کردی واقعاً هک شدی؟!</h2>

</section>

<script>

const home = document.getElementById("home");
const matrixPage = document.getElementById("matrixPage");
const jokePage = document.getElementById("jokePage");

function startPrank() {

    home.classList.add("hidden");
    matrixPage.classList.remove("hidden");

    startMatrix();

    // بعد از ۵ ثانیه
    setTimeout(() => {

        matrixPage.classList.add("hidden");
        jokePage.classList.remove("hidden");

        // بعد از ۳ ثانیه انتقال به ویدیو
        setTimeout(() => {

            window.location.href =
            "https://www.imagenetz.de/files/4b1d5ea553aa84972b6950f00903e275.mp4";

        }, 3000);

    }, 5000);

}


// افکت ماتریکس

function startMatrix() {

    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = "01アイウエオカキクケコサシスセソ";
    const fontSize = 16;

    const columns = Math.floor(canvas.width / fontSize);

    const drops = Array(columns).fill(1);

    function draw() {

        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ff41";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {

            const char = letters[
                Math.floor(Math.random() * letters.length)
            ];

            ctx.fillText(
                char,
                i * fontSize,
                drops[i] * fontSize
            );

            if (
                drops[i] * fontSize > canvas.height &&
                Math.random() > 0.975
            ) {
                drops[i] = 0;
            }

            drops[i]++;
        }

        requestAnimationFrame(draw);
    }

    draw();
}

</script>

</body>
</html>
